
# Nombre que aparecerá en GitHub Actions
name: Python Tests

# Cuándo ejecutar las pruebas
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Trabajos que GitHub debe ejecutar
jobs:
  test:
    # Utilizamos un ordenador Linux de GitHub
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar nuestro repositorio
      - name: Obtener código
        uses: actions/checkout@v4

      # 2. Instalar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Instalar las dependencias del proyecto
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Ejecutar nuestras pruebas automáticas
      - name: Ejecutar pruebas
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
